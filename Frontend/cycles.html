<!DOCTYPE html>
<html>
<head>
    <title>Production Entry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Enter Production Cycles</h2>

        <!-- FORM START -->
        <form id="cycleForm">

            <input type="text" 
                   id="mouldId" 
                   placeholder="Mould ID" 
                   readonly>

            <input type="number" 
                   id="cycles" 
                   placeholder="Enter Cycles" 
                   required>

            <button type="submit">Submit</button>

        </form>
        <!-- FORM END -->

    </div>
</div>

<!-- IMPORTANT: correct path -->
<script src="js/cycles.js"></script>

</body>
</html>
